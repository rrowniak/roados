# The demo and test harness for `ui_core`.
[package]
name = "ui_demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
# The binary target is declared explicitly below, so do not infer a second one.
autobins = false

[dependencies]
ui_core = { path = "../ui_core" }
# `sdl3` is a direct dependency of this binary — it creates the window — so it
# carries its own build configuration rather than relying on feature unification
# through `ui_core`. The list is defined in `ui_core/Cargo.toml`; this copy is a
# mirror to keep in step with it. Cargo unions features across the graph, so a
# divergence in either direction is silent: dropping a feature here that
# `ui_core` still declares changes nothing, and adding one changes the build
# without saying so. `doc/ui/CROSSBUILD.md` §5.4 has the reasoning.
sdl3 = { version = "0.20", features = [
    "build-from-source",
    "build-from-source-unix-console",
] }
# `glow` and `ui_core` are unused until the render context lands: the window
# here is a plain window with no GL context. They are declared because the task
# file lists them, and they are not dead code to remove.
glow = "0.18"

[[bin]]
name = "ui_demo"
path = "src/main.rs"
